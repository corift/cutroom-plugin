<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: __WIDTH__px;
        height: __HEIGHT__px;
        overflow: hidden;
        background: #09090a;
      }
      #root {
        position: relative;
        width: __WIDTH__px;
        height: __HEIGHT__px;
        overflow: hidden;
        font-family: Inter, sans-serif;
      }
      .footage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 1;
      }
      .footage video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .scene {
        z-index: 2;
      }
      #captions {
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="__WIDTH__"
      data-height="__HEIGHT__"
    >
      <div class="footage">
        <video
          id="aroll"
          class="clip"
          src="assets/aroll.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="10"
          data-media-start="0"
          data-track-index="1"
        ></video>
      </div>

      <div
        id="example"
        class="scene"
        data-composition-id="example"
        data-composition-src="compositions/example.html"
        data-start="2"
        data-duration="4"
        data-track-index="2"
        data-track-kind="graphics"
        data-layout="full"
        data-width="__WIDTH__"
        data-height="__HEIGHT__"
      ></div>

      <audio
        id="voice"
        class="clip"
        src="assets/voice.m4a"
        data-start="0"
        data-duration="10"
        data-volume="1"
        data-track-index="8"
      ></audio>
    </div>
    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
